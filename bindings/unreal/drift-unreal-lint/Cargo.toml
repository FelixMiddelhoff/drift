[workspace]

[package]
name = "drift-unreal-lint"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Standalone determinism checker for Unreal C++ (stock Clang, no engine fork)"

[[bin]]
name = "drift-unreal-lint"
path = "src/main.rs"

[dependencies]
clang = { version = "2.0", features = ["clang_6_0"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
serde_json = "1"
anyhow = "1"
