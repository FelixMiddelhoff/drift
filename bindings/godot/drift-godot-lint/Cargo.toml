[workspace]

[package]
name = "drift-godot-lint"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Standalone determinism checker for Godot GDScript (via gdck-syntax)"

[[bin]]
name = "drift-godot-lint"
path = "src/main.rs"

[dependencies]
gdck-syntax = "0.8"
anyhow = "1"
