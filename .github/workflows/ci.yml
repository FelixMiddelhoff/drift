name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fmt-and-lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  core-test:
    name: test (${{ matrix.os }})
    needs: fmt-and-lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # crates/drift-lint is its own detached workspace pinned to a specific
  # nightly (crates/drift-lint/rust-toolchain.toml) — dylint needs
  # rustc-dev/llvm-tools-preview the root stable workspace doesn't. Its
  # own tests (UI tests per rule, in ui/ and examples/) are the actual
  # regression corpus — see docs/rule-catalog.md for what each covers.
  #
  # dylint_driver's build script does a full, uncached clone of
  # rust-lang/rust-clippy on every clean build to extract symbol data for
  # nightly >= 2025-05-06 (confirmed locally — no persistent cache
  # across builds, a real operational fragility, not just a slow step).
  # Swatinem/rust-cache should cache target/ across runs so this only
  # bites on a genuinely clean cache, but if this job goes flaky on a
  # git-clone step, that's why — see the commit that introduced this job.
  drift-lint-test:
    name: drift-lint test (${{ matrix.os }})
    needs: fmt-and-lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned nightly toolchain
        working-directory: crates/drift-lint
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/drift-lint -> target
      # dylint-link is the actual linker crates/drift-lint's own
      # .cargo/config.toml points rustc at — without it installed on
      # PATH, even a dependency's build script fails to link (confirmed
      # by a real CI failure: "linker `dylint-link` not found" on
      # serde_core's build script, nothing to do with drift-lint's own
      # code). `cargo-dylint` isn't invoked in this job (tests run via
      # plain `cargo test`, not `cargo dylint`) but installing both
      # together mirrors local dev setup and README's own instructions.
      - run: cargo install cargo-dylint dylint-link
      - name: Run drift-lint's rule UI tests
        working-directory: crates/drift-lint
        run: cargo test -- --test-threads=1

  # bindings/unreal/drift-unreal-lint is its own detached Cargo workspace
  # (stable toolchain, unlike crates/drift-lint) — a standalone binary
  # over libclang (the `clang` crate), not a root-workspace member, same
  # reasoning as drift-lint above. Needs a real LLVM/Clang install with
  # libclang present; LIBCLANG_PATH points cargo at it explicitly rather
  # than relying on each runner image's own bundled copy (or lack of
  # one), since that's what the local dev setup this mirrors needed too.
  unreal-lint-test:
    name: drift-unreal-lint test (${{ matrix.os }})
    needs: fmt-and-lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/unreal/drift-unreal-lint -> target
      - name: Install LLVM/Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang llvm
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
      - name: Install LLVM/Clang (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Install LLVM/Clang (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y --no-progress
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: Run drift-unreal-lint's fixture tests
        working-directory: bindings/unreal/drift-unreal-lint
        run: cargo test

  csharp-analyzer-test:
    name: Drift.Analyzers test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test bindings/csharp/Drift.Analyzers.Tests
