[package]
name = "drift-lint"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FelixMiddelhoff/drift"
description = "dylint lints catching game-simulation non-determinism before it causes a rollback-netcode desync."
# Cannot be published to crates.io: crates.io rejects any dependency
# without a crates.io version, and clippy_utils is deliberately never
# published there (its own README says it "provides no stability
# guarantees") — confirmed for real via `cargo publish --dry-run`, not
# assumed. Same reason dylint's own example lint libraries are never
# published either; install via `cargo dylint` pointing at this repo
# (git or --path), not `cargo install`/crates.io.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "09382ed3c34e091d7705f96964e303b59978533c" }
dylint_linting = "6.0.4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
dylint_testing = "6.0.4"
# unseeded_rng's fixture (examples/unseeded_rng.rs) needs a real `rand`
# crate to call `rand::random()` against — ui_test_example compiles it
# as a normal example target with real dependency resolution, unlike a
# plain src_base ui test which has none.
rand = "0.10"
# unordered_parallelism's fixture (examples/unordered_parallelism.rs)
# needs a real `rayon` crate to call `.par_iter()` against.
rayon = "1.10"
serde_json = "1"

[features]
rlib = ["dylint_linting/constituent"]

[package.metadata.rust-analyzer]
rustc_private = true

# Detached from the root workspace on purpose: this crate needs a pinned
# nightly + rustc-dev/llvm-tools-preview (see rust-toolchain.toml here),
# the root workspace stays on stable — same reasoning as foldback's
# fuzz crate keeping its own separate workspace/Cargo.lock.
[workspace]
